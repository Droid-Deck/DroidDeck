plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.droiddeck.xrdiagnostics'
    compileSdk 36
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'com.droiddeck.xrdiagnostics'
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk { abiFilters.addAll((project.findProperty('xrAbis') ?: 'arm64-v8a,x86_64').split(',')) }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { externalNativeBuild { cmake { arguments '-DDROIDDECK_XR_FIXTURES=ON' } } }
        release { externalNativeBuild { cmake { arguments '-DDROIDDECK_XR_FIXTURES=OFF' } } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.xr.runtime:runtime:1.0.0'
    implementation 'androidx.xr.arcore:arcore:1.0.0'
    implementation 'androidx.xr.scenecore:scenecore:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'androidx.xr.arcore:arcore-testing:1.0.0'
    testImplementation 'androidx.xr.scenecore:scenecore-testing:1.0.0'
}
