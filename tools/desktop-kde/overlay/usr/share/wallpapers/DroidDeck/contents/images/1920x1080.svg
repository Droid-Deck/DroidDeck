<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- DroidDeck's desktop wallpaper: the D logo on deep navy, its blue core glowing out in rings. -->
  <defs>
    <radialGradient id="bg" cx="960" cy="500" r="1150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16243f"/>
      <stop offset="0.42" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#04060b"/>
    </radialGradient>
    <radialGradient id="glow" cx="960" cy="500" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A9FFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#1A9FFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1A9FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="235" cy="232" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5cbcff"/>
      <stop offset="1" stop-color="#1A9FFF"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="500" r="250" fill="none" stroke="#1A9FFF" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="960" cy="500" r="330" fill="none" stroke="#1A9FFF" stroke-opacity="0.11" stroke-width="1.5"/>
  <circle cx="960" cy="500" r="430" fill="none" stroke="#1A9FFF" stroke-opacity="0.075" stroke-width="1.5"/>
  <circle cx="960" cy="500" r="560" fill="none" stroke="#1A9FFF" stroke-opacity="0.05" stroke-width="1.2"/>
  <circle cx="960" cy="500" r="720" fill="none" stroke="#1A9FFF" stroke-opacity="0.035" stroke-width="1.2"/>
  <circle cx="960" cy="500" r="910" fill="none" stroke="#1A9FFF" stroke-opacity="0.022" stroke-width="1"/>
  <circle cx="960" cy="500" r="330" fill="url(#glow)"/>
  <g transform="translate(730.05 270.05) scale(0.9)">
    <path fill="#f4f7fb" d="M102 75.5H243V140.2A116 116 0 1 0 243 370.8V435.5H102Z"/>
