[package]
name = "droideck-launcher"
version = "0.2.0"
edition = "2024"
description = "Fast native Windows game library for DroidDeck"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hmac = "0.12"
base64 = "0.22"
open = "5.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
threadpool = "1.8"
dirs = "6"
getrandom = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
url = "2.5"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
winit = "0.30"
wry = { version = "0.58.2", default-features = false, features = ["os-webview"] }
aes-gcm = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
