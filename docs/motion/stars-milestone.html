<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroidDeck stars milestone</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;overflow:hidden}
.stage{--unit:min(1vw,1.7777778vh);position:relative;width:calc(100 * var(--unit));aspect-ratio:16/9;overflow:hidden;background:#000;isolation:isolate}
.mark{position:absolute;left:50%;top:31%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%)}
.arc{position:absolute;left:13%;width:74%;height:37%;border:min(calc(1.5 * var(--unit)),22px) solid #fff}
.arc.top{top:0;border-top:0;border-radius:0 0 100px 100px;animation:top 9s cubic-bezier(.2,.7,.2,1) infinite}
.arc.bottom{bottom:0;border-bottom:0;border-radius:100px 100px 0 0;animation:bottom 9s cubic-bezier(.2,.7,.2,1) infinite}
.dot{position:absolute;left:37%;top:37%;width:26%;aspect-ratio:1;border-radius:50%;background:#29a1e9;animation:dot 9s cubic-bezier(.2,.7,.2,1) infinite}
.copy{position:absolute;inset:48% 5% auto;text-align:center;animation:copy 9s ease both infinite}
.name{font-size:min(calc(5.3 * var(--unit)),100px);font-weight:800;letter-spacing:-.055em;line-height:1}
.rule{width:7%;height:3px;margin:2.2% auto;background:#29a1e9;animation:rule 9s ease infinite}
.message{font-size:min(calc(2.15 * var(--unit)),40px);font-weight:700;letter-spacing:.045em;line-height:1.25;text-transform:uppercase}
.message span{color:#29a1e9}
.thanks{margin-top:2%;font-size:min(calc(1.35 * var(--unit)),25px);font-weight:400;letter-spacing:.04em;color:#bfc8d0}
@keyframes top{0%,7%{opacity:0;transform:translateY(-100%) rotate(-90deg)}20%,76%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(-70%) rotate(45deg)}}
@keyframes bottom{0%,7%{opacity:0;transform:translateY(100%) rotate(90deg)}20%,76%{opacity:1;transform:none}90%,100%{opacity:0;transform:translateY(70%) rotate(-45deg)}}
@keyframes dot{0%,10%{opacity:0;transform:scale(0)}24%,76%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(0)}}
@keyframes copy{0%,22%{opacity:0;transform:translateY(12%)}32%,76%{opacity:1;transform:none}88%,100%{opacity:0;transform:translateY(-5%)}}
@keyframes rule{0%,25%{transform:scaleX(0)}36%,76%{transform:scaleX(1)}88%,100%{transform:scaleX(0)}}
@media (max-width:600px) and (orientation:portrait){
body{display:block;overflow:auto}
.stage{width:100%;min-height:100vh;aspect-ratio:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:32px 20px;overflow:visible}
.mark{position:relative;left:auto;top:auto;width:min(32vw,120px);flex:none;transform:none}
.arc{border-width:clamp(4px,3vw,12px)}
.copy{position:relative;inset:auto;width:100%}
.name{font-size:clamp(32px,10vw,52px)}
.rule{width:40px;margin:18px auto}
.message{font-size:clamp(16px,4.5vw,22px)}
.thanks{margin-top:18px;font-size:16px;line-height:1.4}
}
@media (prefers-reduced-motion:reduce){.arc.top,.arc.bottom,.dot,.copy,.rule{animation:none}}
</style>
</head>
<body>
<main class="stage" aria-label="DroidDeck is the most starred PC gaming app on Android. Thank you to our community.">
<div class="mark" aria-hidden="true"><div class="arc top"></div><div class="dot"></div><div class="arc bottom"></div></div>
<div class="copy"><div class="name">DroidDeck</div><div class="rule"></div><div class="message">The <span>most starred</span> PC gaming<br>app on Android</div><div class="thanks">Thank you to our community.</div></div>
</main>
</body>
</html>
