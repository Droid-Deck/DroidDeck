plugins {
    id 'com.android.application'
}
apply plugin: 'kotlin-android'

android {
    namespace 'com.droiddeck.xrsmoke'
    compileSdk 34
    ndkVersion project.findProperty('ndkVersion') ?: '27.3.13750724'

    defaultConfig {
        applicationId 'com.droiddeck.xrsmoke'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    buildFeatures { prefab true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':xr-core')
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
