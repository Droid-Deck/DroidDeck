pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "DroidDeck"
def xrCoreOnly = providers.gradleProperty('xrCoreOnly').getOrElse('false').toBoolean()
include ':xr-core'
if (!xrCoreOnly) include ':app'
