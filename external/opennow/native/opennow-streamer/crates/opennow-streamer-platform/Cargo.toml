[package]
name = "opennow-streamer-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
cc = "1"

[features]
default = []
test-runtime = []

[dependencies]
opennow-streamer-protocol = { path = "../opennow-streamer-protocol" }
opus.workspace = true
serde_json.workspace = true

# DroidDeck: desktop-only dependencies (the Android backend does not use SDL, openh264,
# the recording muxers or the Windows crate).
[target.'cfg(not(target_os = "android"))'.dependencies]
base64.workspace = true
image.workspace = true
openh264.workspace = true
opennow-streamer-platform-windows = { path = "../opennow-streamer-platform-windows" }
oxideav-core.workspace = true
oxideav-mkv.workspace = true
sdl2.workspace = true
scuffle-av1.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["media", "audio", "nativewindow", "api-level-29"] }
ndk-sys = "0.6"
jni = "0.21"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# sdl2-sys ships a single checked-in sdl_bindings.rs generated on Linux and
# copies it for every target unless use-bindgen is on. Its X11 layout assertions
# underflow against Windows LLP64, so Windows must generate bindings from the
# bundled SDL2 headers instead. Requires libclang on Windows build machines.
sdl2 = { workspace = true, features = ["use-bindgen"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
