org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.tooling.parallel=true

# Maven Central answers 429 under load, and one unanswerable artifact fails the
# whole build: a unit-test run stopped at robolectric/nativeruntime-dist-compat.
#
# The property is "tentatives", not "retries": Gradle ignores unknown keys without
# a word, so an earlier version of this (max.retries) changed nothing and the build
# still gave up after three attempts.
#
# Keep the window short on purpose. The backoff doubles from the initial value, so
# 12 tentatives from 3s would spend up to ~100 minutes before giving up -- a red
# build became an hour-long one. Five tentatives from 1.5s covers 22s of throttling,
# which is enough for a 429 burst, and still fails fast when the artifact is really
# unreachable. The durable fix is in the workflow: the cache restore no longer fails,
# so dependencies are not re-downloaded on every run in the first place.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1500
