org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.tooling.parallel=true

# Maven Central answers 429 under load, and one unanswerable artifact fails the
# whole build: a unit-test run stopped at robolectric/nativeruntime-dist-compat
# after the default three attempts. Retry more, with a longer first backoff, so a
# throttled dependency resolves instead of turning a green tree red.
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=3000
