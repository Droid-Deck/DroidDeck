org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Reuse task outputs, skip unchanged configuration, and run independent tasks in parallel.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The NDK the compositor is built with. CI passes the one the runner has installed
# (-PndkVersion=…); this is the fallback for a local build.
ndkVersion=27.3.13750724

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
