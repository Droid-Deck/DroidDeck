name: Sign APKs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful APK build run on wallentx/powervr
        required: true
        type: string
      expected_sha:
        description: Full source commit of that build
        required: true
        type: string
      variants:
        description: JSON array of package variants to sign
        required: false
        type: string
        default: '["standard"]'
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      variants:
        description: JSON array of names from tools/release/variants.txt
        type: string
        required: true
      run_id:
        description: The Build APK run whose apk to sign; empty for the calling run's own
        type: string
        default: ''
      label:
        description: Goes in the file names (a version); empty for <branch>-<short sha>
        type: string
        default: ''
      artifact:
        type: string
        default: droiddeck-signed

permissions:
  contents: read
  actions: read

jobs:
  sign:
    name: sign ${{ matrix.variant }}
    if: >-
      inputs.environment != '' ||
      (github.repository == 'wallentx/DroidDeck' &&
       github.ref == 'refs/heads/wallentx/powervr' && github.event_name == 'workflow_dispatch' &&
       inputs.expected_sha != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'signing-main' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants || '["standard"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify the manual fork build
        if: inputs.expected_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[0-9]+$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" |
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$EXPECTED_SHA" --arg branch "$GITHUB_REF_NAME" '
              .conclusion == "success" and .status == "completed" and
              .event == "workflow_dispatch" and .path == ".github/workflows/build.yml" and
              .head_repository.full_name == $repo and .repository.full_name == $repo and
              .head_sha == $sha and .head_branch == $branch' >/dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" |
            jq -e '
              [.[].jobs[]] as $jobs |
              (["Compile APK and Android tests", "Python and native regression tests", "Compile and test APK"] |
                all(. as $name | [$jobs[] | select(.name == $name and .conclusion == "success")] | length == 1)) and
              all($jobs[]; .conclusion == "success" or .conclusion == "skipped")' >/dev/null
          for pair in "5974f5aef59a58fae323403d9705844f7c4a2b32...$EXPECTED_SHA" "$EXPECTED_SHA...$GITHUB_SHA"; do
            gh api "repos/$GITHUB_REPOSITORY/compare/$pair" |
              jq -e '.status == "ahead" or .status == "identical"' >/dev/null
          done

      - name: The apk (this run's build)
        if: inputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: droiddeck-apk
          path: in

      - name: The apk (a main build)
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n droiddeck-apk -D in

      - name: Verify the manual fork artifact version
        if: inputs.expected_sha != ''
        run: |
          set -euo pipefail
          apks=(in/*.apk)
          [ ${#apks[@]} = 1 ] && [ -f "${apks[0]}" ]
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$tools/aapt" dump badging "${apks[0]}" > "$RUNNER_TEMP/version-badging.txt"
          grep -qF "package: name='com.droiddeck.launcher' versionCode='18' versionName='0.6.0-wallentx.5'" \
            "$RUNNER_TEMP/version-badging.txt"

      - name: Sign
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: droiddeck
          ENVIRONMENT: ${{ inputs.environment || 'signing-main' }}
          VARIANT: ${{ matrix.variant }}
          LABEL: ${{ inputs.expected_sha != '' && '0.6.0-wallentx.5' || inputs.label }}
          MANUAL_FORK: ${{ inputs.expected_sha != '' }}
        run: |
          set -euo pipefail
          if [ "$MANUAL_FORK" = true ]; then
            export RELEASE_SIGNER_SHA256=80465aadce5c34a1d4f71ee4bd8cf7bcce64b5e7836e599f98d0b4f110e210c8
          fi
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::environment '$ENVIRONMENT' has no signing key: run tools/release/make-release-key.sh once"
            exit 1
          fi
          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          ( umask 077; base64 -d <<<"$RELEASE_KEYSTORE_B64" > "$RELEASE_KEYSTORE" )
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          export BUILD_TOOLS
          [ -n "$LABEL" ] || LABEL="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          suffix=$(awk -v v="$VARIANT" '!/^#/ && $1 == v { print $3 }' tools/release/variants.txt)
          [ "$suffix" = - ] && suffix=
          apks=(in/*.apk)
          [ ${#apks[@]} = 1 ] && [ -f "${apks[0]}" ] || { echo "::error::expected one apk in the build"; exit 1; }
          mkdir -p out
          out="out/DroidDeck-$LABEL$suffix.apk"
          tools/release/sign-apk.sh "${apks[0]}" "$VARIANT" "$out"
          ( cd out && sha256sum -- *.apk > "SHA256SUMS-$VARIANT.txt" && cat "SHA256SUMS-$VARIANT.txt" )
          echo "- \`$(basename "$out")\` - $(cut -c1-16 "out/SHA256SUMS-$VARIANT.txt")…" >> "$GITHUB_STEP_SUMMARY"

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact || 'droiddeck-signed' }}-${{ matrix.variant }}
          path: out/*
          if-no-files-found: error
