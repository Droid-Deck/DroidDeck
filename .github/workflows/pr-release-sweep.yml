name: PR Release Sweep
run-name: sweep test builds of closed PRs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-release-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: ci-token
        with:
          app-id: ${{ vars.DROIDDECK_CI_APP_ID }}
          private-key: ${{ secrets.DROIDDECK_CI_APP_KEY }}
          owner: Droid-Deck
          repositories: DroidDeck-CI
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Delete test builds of closed PRs, and of merged PRs a Preview build carries
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          CI_GITHUB_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: python3 tools/release/retire_test_builds.py

  catalog:
    needs: sweep
    if: ${{ always() }}
    uses: ./.github/workflows/update-catalog.yml
    secrets: inherit
