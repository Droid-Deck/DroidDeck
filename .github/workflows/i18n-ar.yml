name: Arabic localization checks

on:
  push:
    branches:
      - feat/arabic-localization-complete-rtl
  pull_request:
    paths:
      - 'app/src/main/res/**'
      - 'app/src/main/java/com/droiddeck/launcher/core/AppLanguage.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'tools/tests/test_arabic_localization.py'
      - '.github/workflows/i18n-ar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arabic-resources:
    name: Arabic resource integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Arabic strings, plurals, arrays, locale and RTL
        run: python3 -m unittest tools/tests/test_arabic_localization.py tools/tests/test_no_hardcoded_ui.py tools/tests/test_droiddeck_fonts.py -v

  android-unit-tests:
    name: Android resources and JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile resources and run unit tests without native packaging
        run: ./gradlew -PskipRust=true :app:testDebugUnitTest --stacktrace
