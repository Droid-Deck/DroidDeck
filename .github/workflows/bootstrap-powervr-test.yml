name: Bootstrap PowerVR test branch
on:
  push:
    branches: [pixel10-powervr]
    paths: [.github/workflows/bootstrap-powervr-test.yml]
permissions:
  contents: write
jobs:
  create-test-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create test branch at inspected wallentx dev revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/Sanketpathania/DroidDeckIMG/git/refs -f ref=refs/heads/pixel10-powervr-test -f sha=bccaf12bb718589e91e7a6883add85a180a7ab8f
