# Meson cross file for building PulseAudio for HarmonyOS 7 (aarch64, musl).
#
# The OpenHarmony NDK's clang is used directly, because its wrapper scripts
# use GNU readlink, which macOS does not have.
#
# Used by tools/build_pulseaudio.sh.

[binaries]
c = '/Volumes/Download-1/ohos-sdk/sdk/native/llvm/bin/clang'
cpp = '/Volumes/Download-1/ohos-sdk/sdk/native/llvm/bin/clang++'
ar = '/Volumes/Download-1/ohos-sdk/sdk/native/llvm/bin/llvm-ar'
strip = '/Volumes/Download-1/ohos-sdk/sdk/native/llvm/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = ['--target=aarch64-linux-ohos', '--sysroot=/Volumes/Download-1/ohos-sdk/sdk/native/sysroot', '-D__MUSL__']
c_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/Volumes/Download-1/ohos-sdk/sdk/native/sysroot']
cpp_args = ['--target=aarch64-linux-ohos', '--sysroot=/Volumes/Download-1/ohos-sdk/sdk/native/sysroot', '-D__MUSL__']
cpp_link_args = ['--target=aarch64-linux-ohos', '--sysroot=/Volumes/Download-1/ohos-sdk/sdk/native/sysroot']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
